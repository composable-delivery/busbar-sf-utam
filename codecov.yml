# Codecov configuration
# See: https://docs.codecov.io/docs/codecov-yaml

codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

fixes:
  - "/home/runner/work/busbar-sf-utam/busbar-sf-utam/::"

ignore:
  - "utam-cli/src/main.rs"
  # Live Salesforce integration harness: exercised against a real scratch org
  # under `cargo test -- --ignored` (the coverage job runs without --ignored),
  # so its driver/coverage branches can't be unit-covered. Excluding the test
  # files from the report does not change the coverage they credit to src/.
  - "utam-runtime/tests/**"
  # Unit-test scaffolding that must live under src/ to retain private access
  # to the items under test (it's a `#[path]` child module of page_object).
  # It's test code, not production: the in-memory MockDriver/MockElement
  # doubles are mostly `unimplemented!()` trait stubs that never execute, so
  # counting them as uncovered would misreport patch coverage.
  - "utam-runtime/src/page_object_tests.rs"
